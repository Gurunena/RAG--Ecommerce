<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin console — Consult</title>
<link rel="stylesheet" href="css/styles.css">
<!-- the console component system is shared with the seller dashboard (read-only reuse) -->
<link rel="stylesheet" href="css/seller-dashboard.css">
<link rel="stylesheet" href="css/admin-dashboard.css">
</head>
<body data-page="admin-dashboard">

<nav class="editorial">
  <div class="nav-inner">
    <a class="logo" href="index.html">
      <img src="images/consult-mark.png" alt="" width="31" height="31"
           style="object-fit:contain; flex:none">
      <div class="logo-copy">
        <div class="logo-text">Consult</div>
        <div class="logo-tagline">AI Shopping Consultant</div>
      </div>
    </a>
    <div class="nav-mid">
      <a href="index.html" data-nav="home">Home</a>
      <a href="products.html" data-nav="products">Shop</a>
      <a href="index.html#chat" class="nav-ask" data-nav="chat">Ask the consultant</a>
      <a href="seller-register.html" data-nav="seller-register">For Sellers</a>
      <div id="navMidExtra" style="display:contents"></div>
    </div>
    <div class="nav-right">
      <button class="icon-btn nav-search-btn" onclick="location.href='products.html'" aria-label="Search products">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="#1B2A4A" stroke-width="1.8"/>
          <path d="M20 20l-3.5-3.5" stroke="#8B2E3C" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="icon-btn" onclick="location.href='index.html#chat'" aria-label="Ask">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" fill="#8B2E3C"/>
        </svg>
      </button>
      <button class="icon-btn" onclick="location.href='cart.html'" aria-label="Cart">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M3 4h2.2l2.3 11.5a1.5 1.5 0 001.5 1.2h8.6a1.5 1.5 0 001.5-1.2L20.5 8H6"
                stroke="#1B2A4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10" cy="20" r="1.3" fill="#8B2E3C"/>
          <circle cx="17" cy="20" r="1.3" fill="#8B2E3C"/>
        </svg>
        <span class="cart-count" id="cartCount" style="display:none">0</span>
      </button>
      <div id="navAuthArea"></div>
    </div>
  </div>
</nav>

<!-- web-master console: same shell as seller-dashboard.html (sidebar + sticky
     top bar + section content), rendered by js/admin-dashboard.js -->
<div class="dash sd" id="dash" data-role="admin">
  <aside class="sd-side" id="sdSide" aria-label="Console sections"></aside>
  <div class="sd-scrim" id="sdScrim" data-act="drawer-close"></div>
  <div class="sd-main">
    <header class="sd-top" id="sdTop"></header>
    <main class="sd-content" id="adminBody" aria-live="polite">
      <!-- replaced by js/admin-dashboard.js; stays visible only if scripts never run -->
      <noscript><div class="sd-card gate ad-notice"><h2>JavaScript is turned off</h2><p class="muted">The admin console needs JavaScript. Turn it on and reload.</p></div></noscript>
    </main>
  </div>
</div>

<footer>
  <div class="footer-links">
    <a href="about.html">About Us</a> · <a href="contact.html">Contact Us</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms &amp; Conditions</a>
  </div>
  © 2026 Consult · Made in Sri Lanka<br>
</footer>

<div class="modal-overlay" id="logoutModal" onclick="if(event.target===this) closeLogoutModal()">
  <div class="modal-box">
    <h3 class="serif">Sign out?</h3>
    <p class="muted" style="font-size:13px; margin:8px 0 20px">You'll need to sign in again to view your cart, orders, or dashboard.</p>
    <div style="display:flex; gap:10px">
      <button type="button" class="btn btn-ghost" style="flex:1" onclick="closeLogoutModal()">Cancel</button>
      <button type="button" class="btn" style="flex:1; background:var(--maroon); color:#fff" onclick="confirmLogout()">Sign out</button>
    </div>
  </div>
</div>

<!-- one modal shell for every dashboard dialog (product form, confirmations) -->
<div class="modal-overlay" id="dashModal">
  <div class="modal-box dmodal" id="dashModalBox" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/seed.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/dash-common.js"></script>
<script src="js/admin-dashboard.js"></script>
<script>
  /* watchdog: if admin-dashboard.js (or a script it needs) failed to load or
     parse, nothing else will ever fill #adminBody — say so instead of a blank page */
  window.addEventListener('load', function(){
    setTimeout(function(){
      var box = document.getElementById('adminBody');
      if (!box || box.hasAttribute('data-ready')) return;
      if (/login\.html/.test(location.href)) return;
      box.innerHTML = '<div class="sd-card gate ad-notice"><h2>The admin console didn&rsquo;t load</h2>' +
        '<p class="muted">One of its scripts failed to load. Open the browser console (F12) for details, then try a hard reload (Ctrl+Shift+R).</p>' +
        '<div class="dempty-actions"><button class="btn btn-primary btn-sm" onclick="location.reload(true)">Reload page</button></div></div>';
    }, 1500);
  });
</script>
</body>
</html>
